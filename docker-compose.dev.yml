# Développement uniquement : un PostgreSQL 16 local pour les tests (la production est chez LWS, sans Docker)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orodis
      POSTGRES_USER: orodis
      POSTGRES_PASSWORD: orodis
    ports:
      - "5433:5432"  # 5433 : votre PostgreSQL local occupe déjà 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
